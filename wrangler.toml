name = "sunpanel"
main = "worker/index.ts"
compatibility_date = "2024-01-01"
compatibility_flags = ["nodejs_compat"]

[[durable_objects.bindings]]
name = "SSE_MANAGER"
class_name = "SSEManager"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["SSEManager"]

# D1 数据库表结构已通过 schema.sql 初始化，无需额外 migrations
[[d1_databases]]
binding = "SUNPANEL_DB"
database_name = "sunpanel-db"
database_id = "f218020b-34fb-45bf-8999-1c9482f338e1"

[[kv_namespaces]]
binding = "IMAGES_KV"
id = "73916ad559924540b8afcc84f0bfed9a"

[vars]
ENVIRONMENT = "production"

[assets]
directory = "./frontend/dist"
binding = "ASSETS"
not_found_handling = "single-page-application" 

# ADMIN_PASSWORD 必须通过环境变量配置，不能硬编码
# 请在部署时通过 wrangler secret put ADMIN_PASSWORD 设置


[observability]
enabled = false
head_sampling_rate = 1

[observability.logs]
enabled = true
head_sampling_rate = 1
persist = true
invocation_logs = true

[observability.traces]
enabled = false
persist = true
head_sampling_rate = 1